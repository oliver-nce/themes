exclude: |
  (?x)^(
    themes/public/dist/.*|
    themes/public/css/.*|
    themes/public/frontend/.*|
    frontend/node_modules/.*|
    .*\.min\.js|
    .*\.lock|
    package-lock\.json
  )$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        files: "themes.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-yaml
      - id: no-commit-to-branch
        args: ["--branch", "master"]
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
        files: "^(?!themes/themes/).*\\.json$"
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.1
    hooks:
      - id: ruff
        name: "Run ruff linter and apply fixes"
        args: ["--fix"]
      - id: ruff-format
        name: "Format Python code"

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Frappe Desk scripts only; the Vue frontend/ app has its own formatting.
        files: "^themes/(themes|public/js)/.*"
        exclude: |
          (?x)^(
            themes/public/dist/.*|
            .*\.min\.js
          )$

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ["--quiet"]
        files: "^themes/(themes|public/js)/.*"
        exclude: |
          (?x)^(
            themes/public/dist/.*|
            .*\.min\.js
          )$

ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false
