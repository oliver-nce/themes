name: CI

on:
  push:
    branches: [version-15, version-16]
  pull_request: { }

permissions:
  contents: read

concurrency:
  group: ci-themes-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (no bench)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
        working-directory: frontend

      - name: Run Python and frontend parity tests
        run: bash scripts/run_tests.sh

      - name: Frontend unit tests
        run: npm test
        working-directory: frontend

  bench-tests:
    name: Bench install, migrate and fresh-install check
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      FRAPPE_BRANCH: ${{ github.base_ref || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          path: apps/themes-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install bench
        run: |
          pip install frappe-bench
          sudo apt-get update && sudo apt-get install -y libmariadb-dev
          mysql --host 127.0.0.1 --port 3306 -uroot -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql --host 127.0.0.1 --port 3306 -uroot -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Init bench
        run: |
          bench init --skip-redis-config-generation --skip-assets --frappe-branch "$FRAPPE_BRANCH" ~/frappe-bench
          cd ~/frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache redis://127.0.0.1:6379
          bench set-config -g redis_queue redis://127.0.0.1:6379
          bench set-config -g redis_socketio redis://127.0.0.1:6379

      - name: Install app and create site
        run: |
          cd ~/frappe-bench
          ln -s "$GITHUB_WORKSPACE/apps/themes-src" apps/themes
          ./env/bin/pip install -e apps/themes
          echo themes >> sites/apps.txt
          bench new-site test_site --db-root-password root --admin-password admin --install-app themes --mariadb-user-host-login-scope='%'

      - name: Migrate
        run: |
          cd ~/frappe-bench
          bench --site test_site migrate

      # The Python tests in themes/tests stub out frappe (see frappe_stub.py), so they
      # run in the unit-tests job above, not through `bench run-tests`.
      - name: Verify fresh install
        run: |
          cd ~/frappe-bench
          echo 'import runpy; runpy.run_path(frappe.get_app_path("themes", "..", "scripts", "verify_fresh_install.py"))["run"]()' \
            | bench --site test_site console
